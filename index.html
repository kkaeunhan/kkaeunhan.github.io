<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kaeun Han's personal page">
  <title>Kaeun Han</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="container">
    <!-- 이름 + 소속 (가운데 정렬) -->
    <header class="title">
      <h1 id="name"></h1>
      <div id="affiliations" class="affiliations"></div>
    </header>

    <!-- 사진(왼쪽) + 소개(오른쪽) -->
    <section class="profile">
      <div class="profile-photo">
        <img id="photo" alt="Profile photo" onerror="this.onerror=null;this.src='images/profile/placeholder.svg';">
      </div>
      <div class="profile-text">
        <div id="bio" class="bio"></div>
        <div id="links" class="links"></div>
      </div>
    </section>

    <!-- 섹션들 (data/content.js 내용으로 채워집니다) -->
    <section id="experience-section">
      <h2>Experience</h2>
      <ul id="experience" class="exp-list"></ul>
    </section>

    <section id="publications-section" hidden>
      <h2>Publications</h2>
      <div id="publications"></div>
    </section>

    <section id="education-section">
      <h2>Education</h2>
      <ul id="education" class="item-list"></ul>
    </section>

    <section id="honors-section">
      <h2>Honors &amp; Awards</h2>
      <ul id="honors" class="item-list"></ul>
    </section>

    <section id="activities-section">
      <h2>Activities &amp; Certificates</h2>
      <ul id="activities" class="item-list"></ul>
    </section>

    <footer class="footer">
      <span id="footer-text"></span>
    </footer>
  </main>

  <script src="data/content.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
